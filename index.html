<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>The City Heroes</title>
  <link rel="icon" href="icon.svg">
  <!-- Open like an app when added to a tablet's home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The City Heroes">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Karantina:wght@700&family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Light-and-shadow effects shared by all drawings (gives flat shapes a rounded, 3D look). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="toon3d" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="5" specularConstant=".9" specularExponent="20" lighting-color="#ffffff" result="spec">
          <feDistantLight azimuth="225" elevation="45"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feDiffuseLighting in="blur" surfaceScale="4" diffuseConstant="1" lighting-color="#ffffff" result="diff">
          <feDistantLight azimuth="225" elevation="58"/>
        </feDiffuseLighting>
        <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1.12" k2="0" k3="0" k4="0" result="lit"/>
        <feComposite in="lit" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0" result="shaded"/>
        <feComposite in="shaded" in2="SourceAlpha" operator="in" result="clean"/>
        <feDropShadow in="clean" dx="5" dy="8" stdDeviation="2" flood-color="#000" flood-opacity=".28"/>
      </filter>
    </defs>
  </svg>
  <main id="app"></main>
  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/themes.js"></script>
  <script src="audio/clips.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/art.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/challenges2.js"></script>
  <script src="js/challenges3.js"></script>
  <script src="js/challenges4.js"></script>
  <script src="js/challenges5.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Play without internet too (only works on the website, not from the file on the computer).
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
      // When a newer version of the game arrives, reload once to show it.
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
    }
  </script>
</body>
</html>
